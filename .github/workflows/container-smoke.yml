name: Container smoke test (temporary)
on:
  push:
    branches: [container-runner]
jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python packages
        timeout-minutes: 5
        run: python -m pip install --quiet --disable-pip-version-check requests pyyaml beautifulsoup4 playwright==1.63.0
      - name: Tools present
        run: |
          python --version
          python3 --version
          git --version
          git status --short | head -5
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
      - name: Import check_jobs and drive Chromium on real boards
        run: |
          python - <<'PY'
          import yaml, check_jobs as cj
          entries = yaml.safe_load(open("companies.yaml"))["companies"]
          pw = [e for e in entries if e.get("type") == "playwright"][:2]
          for e in pw:
              items = cj.get_playwright_links(e)
              print(f"{e['name']}: {len(items)} items via Playwright")
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(); pg.goto("https://example.com"); print("chromium title:", pg.title()); b.close()
          PY
