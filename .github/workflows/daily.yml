name: Daily Job Check
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    # Runs inside Microsoft's Playwright image, which ships Chromium and every
    # system library it needs. Before 2026-10-07 each run apt-installed those
    # libraries and fonts from Ubuntu's mirrors, and that step hung twice on
    # 2026-08-19 and timed out on 2026-10-07 (a 5.6 MB font package took 11
    # minutes). Keep the image tag and the playwright pin below on the same
    # version, or the Python package will look for browsers the image lacks.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    # Job ceiling: a normal run takes ~45-60 min. Without this, a hang rides
    # GitHub's 6-hour limit and ends as "cancelled", which skips the
    # if: failure() email below -- exactly what happened twice on 2026-08-19
    # (runs 32235450255 and 32294869961, both dead at 6h, both silent).
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out repo
        # In the container, git refuses the workspace ("detected dubious
        # ownership") because it belongs to the host runner's user, so every
        # git command in the commit step would fail. actions/checkout marks it
        # safe only in a temporary HOME it throws away; this marks it safe in
        # the job's real HOME, which every later step shares.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python packages
        # Only pip packages now; browsers and system libraries are in the
        # image. A step timeout counts as a FAILURE, so the failure email sends.
        timeout-minutes: 5
        run: |
          python -m pip install --quiet --disable-pip-version-check requests pyyaml beautifulsoup4 playwright==1.63.0

      - name: Run script
        id: scrape
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          echo "ABOUT TO RUN PYTHON"
          python -c "print('PYTHON PRINT WORKS')"
          python -u check_jobs.py
          echo "PYTHON FINISHED"
          echo "LIST FILES:"
          ls -la

      - name: Commit updated memory files
        # Deliberately no "if: always()". check_jobs.py exits non-zero when
        # the digest email cannot be sent (or on any crash), and this step
        # must then be skipped: committing seen_jobs.json after a failed send
        # would mark that day's postings as seen without Paul ever getting
        # them. Skipped here, they are found again as new on the next run.
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add seen_jobs.json company_health.json search_cache.json companies.yaml || true
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git pull --rebase origin main
          git push

      - name: Start the morning brief
        # Starts paul-job-pipeline's morning brief as soon as the digest is
        # out. Its own triggers are fixed times (13:00 UTC, then GitHub crons
        # at 14, 15 and 17 that drift), while this job starts hours after its
        # 08:30 cron, so the digest often sat until a late cron or the next
        # day's catch-up. A brief that already processed today's digest exits
        # without doing anything, so the scheduled triggers stay as backstops.
        # Runs only when check_jobs.py reports a digest with postings went
        # out, and even if the commit step failed, since the email is sent by
        # then. from_scraper=true makes the brief wait a few minutes for Gmail
        # to show the digest and never send its "no digest today" notice
        # (paul-job-pipeline #6). continue-on-error: an expired or revoked
        # token must never fail the scraper; the brief then waits for its
        # scheduled triggers. The token is a fine-grained PAT, Actions
        # read/write on paul-job-pipeline only (Paul, 2026-10-07).
        if: ${{ !cancelled() && steps.scrape.outputs.digest_sent == 'true' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://api.github.com/repos/paulwhitaker06/paul-job-pipeline"
              "/actions/workflows/cron-daily-morning-brief.yml/dispatches",
              data=b'{"ref": "main", "inputs": {"from_scraper": "true"}}', method="POST",
              headers={"Authorization": "Bearer " + os.environ.get("TOKEN", ""),
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"Morning brief started (HTTP {r.status})")
          except urllib.error.HTTPError as e:
              print(f"::warning::Could not start the morning brief (HTTP {e.code}); "
                    "it will run on its scheduled triggers. Check PIPELINE_DISPATCH_TOKEN.")
              raise SystemExit(1)
          EOF

      - name: Send failure notification
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python3 - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          host = os.environ.get("SMTP_HOST")
          port = int(os.environ.get("SMTP_PORT", "587"))
          user = os.environ.get("SMTP_USER")
          password = os.environ.get("SMTP_PASS")
          to_email = os.environ.get("TO_EMAIL")
          if all([host, user, password, to_email]):
              msg = MIMEText("The job tracker workflow failed. Check GitHub Actions for details:\nhttps://github.com/paulwhitaker06/job-tracker/actions\n\nNothing was marked as seen on this run, so the next successful run reports the same postings.")
              msg["Subject"] = "⚠️ Job Tracker Failed Today"
              msg["From"] = user
              msg["To"] = to_email
              with smtplib.SMTP(host, port, timeout=30) as s:
                  s.ehlo(); s.starttls(); s.ehlo()
                  s.login(user, password)
                  s.sendmail(user, [to_email], msg.as_string())
              print("Failure notification sent")
          EOF
